<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header>
    <img class="mark" src="../icons/icon128.png" alt="">
    <h1>Детектор ИИ-текста</h1>
    <p class="sub">Анализ выполняется на вашем устройстве,<br>текст никуда не отправляется.</p>
  </header>

  <section class="actions">
    <button id="run" class="btn primary">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6V4.5A1.5 1.5 0 0 1 4.5 3H6M14 3h1.5A1.5 1.5 0 0 1 17 4.5V6M17 14v1.5a1.5 1.5 0 0 1-1.5 1.5H14M6 17H4.5A1.5 1.5 0 0 1 3 15.5V14M6 10h8"/></svg>
      <span>Проанализировать страницу</span>
    </button>
    <button id="article" class="btn">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 2.5h6l3.5 3.5v10a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 4 16V4a1.5 1.5 0 0 1 1.5-1.5zM11 2.5V6.5h4M7 10h6M7 13h4"/></svg>
      <span>Оценить статью целиком</span>
    </button>
    <button id="toggle" class="btn">
      <svg id="toggleIcon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z"/><circle cx="10" cy="10" r="2.5"/><path class="slash" d="M3.5 3.5l13 13"/></svg>
      <span id="toggleText">Убрать подсветку</span>
    </button>
  </section>

  <section id="legend" class="legend" aria-label="Обозначения">
    <span class="chip"><i class="sw y"></i>Средняя вероятность ИИ</span>
    <span class="chip"><i class="sw r"></i>Высокая вероятность ИИ</span>
  </section>

  <p id="msg" class="msg" role="status"></p>

  <section class="settings">
    <button id="settingsToggle" class="settings-head" aria-expanded="false" aria-controls="settingsPanel">
      <svg class="gear" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h8M15 6h2M3 14h2M9 14h8"/><circle cx="13" cy="6" r="2"/><circle cx="7" cy="14" r="2"/></svg>
      <span>Настройки</span>
      <svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 8l4 4 4-4"/></svg>
    </button>
    <div id="settingsPanel" class="settings-panel" inert><div class="inner">
      <label class="row">
        <span class="label">Автоматические пороги<small>подобраны при обучении; выключите, чтобы задать свои</small></span>
        <span class="switch"><input id="modelThresholds" type="checkbox"><i></i></span>
      </label>
      <label class="row">
        <span class="label"><i class="sw y"></i>Средняя вероятность — от, %</span>
        <input id="low" class="num" type="number" min="0" max="100">
      </label>
      <label class="row">
        <span class="label"><i class="sw r"></i>Высокая вероятность — от, %</span>
        <input id="high" class="num" type="number" min="0" max="100">
      </label>
      <label class="row">
        <span class="label">Минимум слов в абзаце</span>
        <input id="minWords" class="num" type="number" min="5" max="500">
      </label>
      <a href="#" id="bench" class="bench">Замер скорости…</a>
    </div></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
